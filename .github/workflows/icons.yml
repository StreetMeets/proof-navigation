name: Generate Proof app icons
on:
  push:
    paths:
      - icon.svg
      - .github/workflows/icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for name, size in [('icon-192.png',192),('icon-512.png',512),('apple-touch-icon.png',180)]:
              cairosvg.svg2png(url='icon.svg',write_to=name,output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate iOS and Android icons from Proof dragon logo"
            git push
          fi
