<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STREETMEETS SECRET DRIFT</title><style>body{background:#09090b;color:#eee;font:16px system-ui;margin:auto;max-width:620px;padding:24px}h1{font-size:48px;line-height:1;color:#ff3948}small{color:#aaa}section,form{background:#18181b;padding:20px;border:1px solid #333;border-radius:16px;margin:16px 0}input,button,textarea{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;background:#101014;color:white;border:1px solid #555;border-radius:8px;font:inherit}button{background:#b91c2c;border:0;font-weight:bold}button:disabled{opacity:.5}label{display:block}img{max-width:100%}a{color:#ff6770}</style><small>STREETMEETS / INVITATION ONLY</small><h1>SECRET<br>DRIFT</h1><p>50 vozidel • Pouze drifteři • Uzavřená povolená plocha</p><p id="status" role="status">Registrace zatím není otevřena.</p><form id="apply"><label>Jméno<input name="name" required maxlength="100"></label><label>Telefon (+420…)<input name="phone" type="tel" required pattern="\+?[0-9 ]{9,16}"></label><label>Instagram<input name="instagram" required maxlength="100"></label><label>Vozidlo<input name="car" required maxlength="100"></label><label>SPZ<input name="plate" required maxlength="15"></label><label>Fotografie vozidla<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label><label><input style="width:auto" type="checkbox" required> Souhlasím se zpracováním údajů pro organizaci akce a s pravidly bezpečného driftování na uzavřené ploše.</label><button disabled>Požádat o účast</button></form><details><summary>Administrace</summary><form id="login"><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Heslo" required><button disabled>Přihlásit se</button></form><section id="admin" hidden></section></details><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const status=document.querySelector('#status');try{const cfg=await fetch('./config.json').then(r=>{if(!r.ok)throw Error();return r.json()});const db=createClient(cfg.url,cfg.key);const apply=document.querySelector('#apply'),login=document.querySelector('#login'),admin=document.querySelector('#admin');document.querySelectorAll('button').forEach(b=>b.disabled=false);status.textContent='O účasti rozhoduje organizátor.';apply.onsubmit=async e=>{e.preventDefault();const b=apply.querySelector('button');b.disabled=true;try{const f=new FormData(apply),p=f.get('photo');if(p.size>3000000||!['image/jpeg','image/png','image/webp'].includes(p.type))throw Error('Fotografie musí být JPG, PNG nebo WebP do 3 MB.');const photo=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(p)});const {error}=await db.from('drift_requests').insert({name:f.get('name'),phone:f.get('phone'),instagram:f.get('instagram'),car:f.get('car'),plate:f.get('plate'),photo});if(error)throw error;apply.reset();status.textContent='Žádost přijata. Vyčkej na SMS.'}catch(e){status.textContent=e.message||'Žádost se nepodařilo odeslat.'}finally{b.disabled=false}};login.onsubmit=async e=>{e.preventDefault();const f=new FormData(login);const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){status.textContent=error.message;return}await load()};function node(tag,t,parent){const n=document.createElement(tag);n.textContent=t;parent.append(n);return n}async function load(){const {data:settings,error}=await db.from('drift_event').select('*').single();if(error){status.textContent='Přístup odepřen nebo databáze není nastavena.';return}const {data:rows,error:err}=await db.from('drift_requests').select('*').order('created_at');if(err)return;admin.hidden=false;admin.replaceChildren();node('h2','Schváleno '+rows.filter(r=>r.state==='approved').length+' / 50',admin);const loc=node('input','',admin);loc.value=settings.location;loc.placeholder='Místo';const time=node('input','',admin);time.value=settings.event_time;time.placeholder='Datum a čas';node('button','Uložit místo a čas',admin).onclick=async()=>{const {error}=await db.from('drift_event').update({location:loc.value,event_time:time.value}).eq('id',1);status.textContent=error?error.message:'Uloženo';await load()};for(const r of rows){const s=node('section','',admin);node('strong',r.name+' • '+r.car,s);node('p',r.plate+' | '+r.phone+' | '+r.instagram+' | '+r.state,s);if(/^data:image\/(jpeg|png|webp);base64,/.test(r.photo)){const im=node('img','',s);im.src=r.photo}const sms=()=>{const msg='STREETMEETS SECRET DRIFT: Účast schválena. Místo: '+settings.location+' | Datum a čas: '+settings.event_time+' | Kód: '+r.id.slice(0,12)+' | Pozvánka je nepřenosná.';location.href='sms:'+r.phone.replace(/[^+0-9]/g,'')+'&body='+encodeURIComponent(msg)};node('button',r.state==='approved'?'Otevřít SMS':'Schválit a připravit SMS',s).onclick=async()=>{if(!settings.location||!settings.event_time){status.textContent='Nejdříve nastav místo a čas.';return}const {error}=await db.rpc('drift_decide',{rid:r.id,decision:'approved'});if(error){status.textContent=error.message;return}sms();await load()};node('button','Zamítnout / odebrat',s).onclick=async()=>{const {error}=await db.rpc('drift_decide',{rid:r.id,decision:'rejected'});if(error)status.textContent=error.message;else await load()}}node('button','Odhlásit',admin).onclick=async()=>{await db.auth.signOut();admin.hidden=true;admin.replaceChildren()}}if((await db.auth.getSession()).data.session)await load()}catch(e){status.textContent='Registrace zatím není otevřena – čeká na připojení databáze.'}</script></html>
